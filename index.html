<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16110B">
<title>OYEN Link</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --oyen:#FF7A33;
    --oyen-dark:#C85A1E;
    --bg:#16110B;
    --surface:rgba(32,24,16,0.62);
    --surface-solid:#241a11;
    --line:rgba(255,255,255,0.14);
    --text:#FFF6EC;
    --text-dim:rgba(255,246,236,0.68);
    --danger:#F2635F;
    --radius:20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; min-height:100%;}
  body{
    background-color:var(--bg);
    background-image:
      linear-gradient(180deg, rgba(16,11,7,.60), rgba(16,11,7,.82)),
      url('background.jpg');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    min-height:100vh;
    padding-bottom:calc(env(safe-area-inset-bottom) + 20px);
  }
  input,textarea{-webkit-user-select:text; user-select:text;}

  .wrap{max-width:520px; margin:0 auto; padding:30px 18px 40px;}

  header{text-align:center; padding:6px 0 20px;}
  .mark{
    width:64px; height:64px; border-radius:18px; margin:0 auto 12px;
    background:linear-gradient(160deg, var(--oyen), var(--oyen-dark));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(255,122,51,0.35);
  }
  .mark svg{width:32px; height:32px;}
  header h1{
    font-family:'Baloo 2', sans-serif; font-size:28px; font-weight:800; margin:0;
    letter-spacing:-0.01em;
  }
  header p{margin:4px 0 0; font-size:13.5px; color:var(--text-dim);}

  .tiktok-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--surface); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:14px; padding:13px;
    text-decoration:none; color:var(--text); font-weight:600; font-size:14.5px;
    margin:18px 0 24px; transition:transform .1s, border-color .15s;
  }
  .tiktok-btn:active{transform:scale(0.98);}
  .tiktok-btn svg{width:19px; height:19px; flex:none;}
  .tiktok-btn b{color:var(--oyen);}

  .admin-bar{
    display:none; align-items:center; justify-content:space-between; gap:8px;
    background:rgba(255,122,51,0.14); border:1px solid var(--oyen);
    border-radius:12px; padding:10px 12px; margin-bottom:16px; font-size:12.5px;
  }
  .admin-bar.show{display:flex;}
  .admin-bar span{color:var(--oyen); font-weight:700;}
  .admin-bar button{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    border-radius:8px; padding:6px 10px; font-size:11.5px; font-family:inherit; cursor:pointer;
  }

  .add-form{
    display:none; flex-direction:column; gap:10px;
    background:var(--surface); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:18px;
  }
  .add-form.show{display:flex;}
  .add-form label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
  .add-form input{
    width:100%; background:rgba(0,0,0,0.3); border:1px solid var(--line); border-radius:11px;
    padding:12px 13px; color:var(--text); font-size:15px; font-family:inherit; outline:none;
  }
  .add-form input:focus{border-color:var(--oyen);}
  .add-form button{
    background:var(--oyen); color:#1a0d02; border:none; border-radius:11px;
    padding:13px; font-size:14.5px; font-weight:700; font-family:inherit; cursor:pointer;
  }
  .add-form button:disabled{opacity:.5;}

  .list{display:flex; flex-direction:column; gap:10px;}
  .card{
    background:var(--surface); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:16px; padding:14px;
    display:flex; align-items:center; gap:12px;
  }
  .card-body{flex:1; min-width:0;}
  .card-name{font-family:'Baloo 2', sans-serif; font-size:15.5px; font-weight:700; margin:0 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card-url{font-size:11.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;}
  .card-actions{display:flex; gap:6px; flex:none;}
  .icon-btn{
    width:38px; height:38px; border-radius:11px; border:1px solid var(--line);
    background:rgba(0,0,0,0.25); display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text); text-decoration:none;
  }
  .icon-btn svg{width:17px; height:17px;}
  .icon-btn.download{border-color:var(--oyen); color:var(--oyen);}
  .icon-btn.delete{color:var(--danger); border-color:rgba(242,99,95,0.35);}

  .empty{text-align:center; padding:50px 20px; color:var(--text-dim);}
  .empty svg{width:44px; height:44px; opacity:.6; margin-bottom:14px;}
  .empty p{font-size:14px; margin:0; line-height:1.5;}

  footer{text-align:center; margin-top:28px;}
  .admin-trigger{
    background:none; border:none; color:var(--text-dim); font-size:11px;
    opacity:.5; padding:10px; font-family:inherit; cursor:pointer;
  }

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6);
    align-items:flex-end; justify-content:center; z-index:100;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--surface-solid); border:1px solid var(--line);
    border-radius:22px 22px 0 0; padding:22px 18px calc(env(safe-area-inset-bottom) + 22px);
    width:100%; max-width:520px; display:flex; flex-direction:column; gap:12px;
    max-height:85vh; overflow-y:auto;
  }
  .modal h2{font-family:'Baloo 2', sans-serif; font-size:19px; margin:0 0 2px;}
  .modal p.hint{font-size:12.5px; color:var(--text-dim); margin:0 0 6px; line-height:1.5;}
  .modal label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
  .modal input{
    width:100%; background:rgba(0,0,0,0.3); border:1px solid var(--line); border-radius:11px;
    padding:12px 13px; color:var(--text); font-size:14.5px; font-family:inherit; outline:none; margin-bottom:10px;
  }
  .modal input:focus{border-color:var(--oyen);}
  .modal-actions{display:flex; gap:10px; margin-top:4px;}
  .modal-actions button{
    flex:1; border-radius:11px; padding:13px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; border:none;
  }
  .btn-save{background:var(--oyen); color:#1a0d02;}
  .btn-cancel{background:none; border:1px solid var(--line) !important; color:var(--text-dim);}

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--surface-solid); border:1px solid var(--line); color:var(--text);
    padding:11px 18px; border-radius:11px; font-size:13px; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; z-index:200; max-width:88vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mark" id="logoTap">
      <svg viewBox="0 0 24 24" fill="none">
        <ellipse cx="12" cy="14.5" rx="5.2" ry="4" fill="#1a0d02"/>
        <circle cx="6.3" cy="8.5" r="2.1" fill="#1a0d02"/>
        <circle cx="10.3" cy="6.3" r="2.1" fill="#1a0d02"/>
        <circle cx="13.7" cy="6.3" r="2.1" fill="#1a0d02"/>
        <circle cx="17.7" cy="8.5" r="2.1" fill="#1a0d02"/>
      </svg>
    </div>
    <h1>OYEN Link</h1>
    <p>Kumpulan link download dari OYEN.</p>
  </header>

  <a class="tiktok-btn" href="https://www.tiktok.com/@meong_13d" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.82a4.28 4.28 0 01-2.05-3.5h-3.1v13.4a2.6 2.6 0 11-2.6-2.6c.26 0 .5.03.74.1V9.9a5.7 5.7 0 00-.74-.05A5.72 5.72 0 108.5 21.4a5.72 5.72 0 005.71-5.72V9.1a7.4 7.4 0 004.39 1.42V7.4a4.27 4.27 0 01-2-1.58z"/></svg>
    Dukung OYEN, <b>Follow TikTok @meong_13d</b>
  </a>

  <div class="admin-bar" id="adminBar">
    <span>🐾 Mode Admin Aktif</span>
    <button id="logoutBtn">Keluar</button>
  </div>

  <form class="add-form" id="addForm">
    <div>
      <label for="nameInput">Nama Link</label>
      <input id="nameInput" type="text" placeholder="Contoh: Preset Video 1" required>
    </div>
    <div>
      <label for="urlInput">URL</label>
      <input id="urlInput" type="url" placeholder="https://…" required>
    </div>
    <button type="submit" id="addSubmitBtn">Tambah Link</button>
  </form>

  <div class="list" id="list"></div>

  <div class="empty" id="emptyState" style="display:none">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v11m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="#FFF6EC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <p>Belum ada link.<br>Nantikan update dari OYEN ya!</p>
  </div>

  <footer>
    <button class="admin-trigger" id="adminTrigger">·</button>
  </footer>

</div>

<div class="modal-overlay" id="setupOverlay">
  <div class="modal">
    <h2>Masuk Mode Admin</h2>
    <p class="hint">Isi sekali saja. Data ini tersimpan di HP kamu sendiri, tidak pernah dikirim ke siapa pun selain GitHub.</p>
    <div>
      <label for="ghOwner">GitHub Username</label>
      <input id="ghOwner" type="text" autocomplete="off" autocapitalize="off">
    </div>
    <div>
      <label for="ghRepo">Nama Repository</label>
      <input id="ghRepo" type="text" autocomplete="off" autocapitalize="off">
    </div>
    <div>
      <label for="ghBranch">Branch</label>
      <input id="ghBranch" type="text" value="main" autocomplete="off" autocapitalize="off">
    </div>
    <div>
      <label for="ghToken">Personal Access Token</label>
      <input id="ghToken" type="password" autocomplete="off">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="setupCancel">Batal</button>
      <button class="btn-save" id="setupSave">Masuk</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const CFG_KEY = "oyenlink.admin";
  let items = [];
  let currentSha = null;

  function getConfig(){
    try { return JSON.parse(localStorage.getItem(CFG_KEY)); } catch { return null; }
  }
  function setConfig(cfg){ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }
  function clearConfig(){ localStorage.removeItem(CFG_KEY); }

  function isAdmin(){ return !!getConfig(); }

  function showToast(msg){
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.remove("show"), 2200);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function hostOf(url){
    try{ return new URL(url).hostname.replace(/^www\./,""); }catch{ return url; }
  }

  function render(){
    const listEl = $("list"), emptyEl = $("emptyState");
    listEl.innerHTML = "";
    if(items.length === 0){
      emptyEl.style.display = "block";
    } else {
      emptyEl.style.display = "none";
      items.forEach((item) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-body">
            <p class="card-name">${escapeHtml(item.name)}</p>
            <span class="card-url">${escapeHtml(hostOf(item.url))}</span>
          </div>
          <div class="card-actions">
            <a class="icon-btn download" href="${escapeHtml(item.url)}" target="_blank" rel="noopener" title="Unduh">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 18h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            ${isAdmin() ? `<button class="icon-btn delete" data-id="${item.id}" title="Hapus">
              <svg viewBox="0 0 24 24" fill="none"><path d="M5 6h14M9 6V4h6v2m-8 0l1 14h8l1-14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>` : ""}
          </div>`;
        listEl.appendChild(card);
      });
    }
    $("adminBar").classList.toggle("show", isAdmin());
    $("addForm").classList.toggle("show", isAdmin());
  }

  async function loadPublicLinks(){
    try{
      const res = await fetch("./links.json?_=" + Date.now(), { cache: "no-store" });
      items = await res.json();
    }catch{
      items = [];
    }
    render();
  }

  // --- base64 helpers that safely handle unicode (emoji, accents) ---
  function utf8ToBase64(str){
    const bytes = new TextEncoder().encode(str);
    let bin = "";
    bytes.forEach((b) => bin += String.fromCharCode(b));
    return btoa(bin);
  }
  function base64ToUtf8(b64){
    const bin = atob(b64);
    const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }

  function ghHeaders(cfg){
    return {
      "Authorization": "Bearer " + cfg.token,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
  }
  function ghUrl(cfg){
    return `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/links.json`;
  }

  async function ghFetchCurrent(cfg){
    const res = await fetch(ghUrl(cfg) + "?ref=" + encodeURIComponent(cfg.branch), { headers: ghHeaders(cfg) });
    if(!res.ok) throw new Error("Gagal ambil data (status " + res.status + ")");
    const data = await res.json();
    currentSha = data.sha;
    return JSON.parse(base64ToUtf8(data.content));
  }

  async function ghCommit(cfg, newItems, message){
    const body = {
      message,
      content: utf8ToBase64(JSON.stringify(newItems, null, 2)),
      sha: currentSha,
      branch: cfg.branch
    };
    const res = await fetch(ghUrl(cfg), { method: "PUT", headers: ghHeaders(cfg), body: JSON.stringify(body) });
    if(!res.ok){
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || ("Gagal menyimpan (status " + res.status + ")"));
    }
    const data = await res.json();
    currentSha = data.content.sha;
  }

  // --- add / delete (admin only) ---
  $("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const cfg = getConfig();
    if(!cfg) return;
    const nameInput = $("nameInput"), urlInput = $("urlInput"), btn = $("addSubmitBtn");
    let url = urlInput.value.trim();
    const name = nameInput.value.trim();
    if(!url || !name) return;
    if(!/^https?:\/\//i.test(url)) url = "https://" + url;

    btn.disabled = true; btn.textContent = "Menyimpan…";
    try{
      const remote = await ghFetchCurrent(cfg);
      remote.push({ id: Date.now() + "-" + Math.random().toString(36).slice(2,7), name, url });
      await ghCommit(cfg, remote, `Tambah link: ${name}`);
      items = remote;
      render();
      nameInput.value = ""; urlInput.value = "";
      showToast("Link ditambahkan! Muncul publik dalam ~1 menit.");
    }catch(err){
      showToast(err.message || "Gagal menambah link");
    }finally{
      btn.disabled = false; btn.textContent = "Tambah Link";
    }
  });

  $("list").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-id]");
    if(!btn) return;
    const cfg = getConfig();
    if(!cfg) return;
    const id = btn.dataset.id;
    if(!confirm("Hapus link ini?")) return;
    btn.disabled = true;
    try{
      const remote = await ghFetchCurrent(cfg);
      const filtered = remote.filter((i) => i.id !== id);
      await ghCommit(cfg, filtered, "Hapus link");
      items = filtered;
      render();
      showToast("Link dihapus");
    }catch(err){
      showToast(err.message || "Gagal menghapus link");
      btn.disabled = false;
    }
  });

  // --- admin login flow ---
  let tapCount = 0, tapTimer = null;
  function handleAdminTap(){
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => tapCount = 0, 1500);
    if(tapCount >= 5){
      tapCount = 0;
      if(isAdmin()){
        showToast("Sudah dalam mode admin");
      } else {
        $("setupOverlay").classList.add("show");
      }
    }
  }
  $("logoTap").addEventListener("click", handleAdminTap);
  $("adminTrigger").addEventListener("click", handleAdminTap);

  $("setupCancel").addEventListener("click", () => $("setupOverlay").classList.remove("show"));
  $("setupSave").addEventListener("click", async () => {
    const owner = $("ghOwner").value.trim();
    const repo = $("ghRepo").value.trim();
    const branch = $("ghBranch").value.trim() || "main";
    const token = $("ghToken").value.trim();
    if(!owner || !repo || !token){ showToast("Lengkapi semua field"); return; }
    const cfg = { owner, repo, branch, token };
    const saveBtn = $("setupSave");
    saveBtn.disabled = true; saveBtn.textContent = "Memeriksa…";
    try{
      await ghFetchCurrent(cfg); // validates credentials + repo/path exist
      setConfig(cfg);
      $("setupOverlay").classList.remove("show");
      await loadPublicLinks();
      showToast("Mode admin aktif 🐾");
    }catch(err){
      showToast(err.message || "Token / repo tidak valid");
    }finally{
      saveBtn.disabled = false; saveBtn.textContent = "Masuk";
    }
  });

  $("logoutBtn").addEventListener("click", () => {
    clearConfig();
    currentSha = null;
    render();
    showToast("Keluar dari mode admin");
  });

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  loadPublicLinks();
</script>
</body>
</html>
