<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12131F">
<title>LinkDrop — Antrian Unduhan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12131F;
    --surface:#1C1E2E;
    --surface-2:#242640;
    --line:#2E3050;
    --text:#EDEDF5;
    --text-dim:#8B8DA8;
    --amber:#F2A93B;
    --amber-dim:#3A2E1A;
    --green:#4ADE80;
    --green-dim:#173323;
    --danger:#F2635F;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a1c30 0%, var(--bg) 55%) fixed;
    color:var(--text);
    font-family:'Space Grotesk', system-ui, sans-serif;
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-user-select:none; user-select:none;
  }
  input{-webkit-user-select:text; user-select:text;}

  .wrap{max-width:520px; margin:0 auto; padding:24px 18px 40px;}

  header{padding:8px 2px 22px; display:flex; align-items:center; gap:12px;}
  .mark{
    width:40px; height:40px; border-radius:11px;
    background:linear-gradient(160deg, var(--amber), #d98a1f);
    display:flex; align-items:center; justify-content:center;
    flex:none;
  }
  .mark svg{width:20px; height:20px;}
  header h1{font-size:20px; font-weight:700; margin:0; letter-spacing:-0.01em;}
  header p{margin:2px 0 0; font-size:13px; color:var(--text-dim);}

  form{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    display:flex; flex-direction:column; gap:10px;
  }
  .field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
  .field input{
    width:100%; background:var(--bg); border:1px solid var(--line); border-radius:11px;
    padding:12px 13px; color:var(--text); font-size:15px; font-family:'JetBrains Mono', monospace;
    outline:none; transition:border-color .15s;
  }
  .field input:focus{border-color:var(--amber);}
  .field.name input{font-family:'Space Grotesk', sans-serif;}
  form button{
    margin-top:2px;
    background:var(--amber); color:#1a1305; border:none; border-radius:11px;
    padding:13px; font-size:15px; font-weight:700; font-family:inherit;
    cursor:pointer; transition:transform .1s, filter .15s;
  }
  form button:active{transform:scale(0.98); filter:brightness(0.95);}
  form button:disabled{opacity:.4;}

  .summary{
    display:flex; justify-content:space-between; align-items:center;
    margin:22px 2px 10px; font-size:13px; color:var(--text-dim);
  }
  .summary b{color:var(--text); font-weight:600;}
  .actions-row{display:flex; gap:8px;}
  .ghost-btn{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    border-radius:9px; padding:6px 11px; font-size:12px; font-family:inherit;
    cursor:pointer; font-weight:600;
  }
  .ghost-btn.primary{border-color:var(--amber); color:var(--amber);}

  .queue{display:flex; flex-direction:column; gap:10px;}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:15px;
    padding:13px 13px 13px 14px; display:flex; align-items:center; gap:12px;
    position:relative; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  }
  .card.pending::before{background:var(--amber);}
  .card.done::before{background:var(--green);}

  .status-dot{
    width:9px; height:9px; border-radius:50%; flex:none;
  }
  .card.pending .status-dot{background:var(--amber); box-shadow:0 0 0 3px var(--amber-dim);}
  .card.done .status-dot{background:var(--green); box-shadow:0 0 0 3px var(--green-dim);}

  .card-body{flex:1; min-width:0;}
  .card-name{font-size:14.5px; font-weight:600; margin:0 0 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card-url{
    font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--text-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;
  }
  .card-actions{display:flex; gap:6px; flex:none;}
  .icon-btn{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface-2); display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text);
  }
  .icon-btn svg{width:16px; height:16px;}
  .icon-btn.download{border-color:var(--amber); color:var(--amber);}
  .icon-btn.delete{color:var(--danger); border-color:#3a2224;}

  .empty{
    text-align:center; padding:50px 20px; color:var(--text-dim);
  }
  .empty svg{width:44px; height:44px; opacity:.5; margin-bottom:14px;}
  .empty p{font-size:14px; margin:0; line-height:1.5;}

  .install-banner{
    display:none;
    background:var(--surface-2); border:1px solid var(--amber);
    border-radius:13px; padding:12px 14px; margin-bottom:16px;
    align-items:center; justify-content:space-between; gap:10px;
  }
  .install-banner.show{display:flex;}
  .install-banner span{font-size:13px; color:var(--text);}
  .install-banner button{
    background:var(--amber); color:#1a1305; border:none; border-radius:8px;
    padding:8px 13px; font-size:12.5px; font-weight:700; font-family:inherit; cursor:pointer; flex:none;
  }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:11px 18px; border-radius:11px; font-size:13px; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; z-index:50; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v11m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="#1a1305" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <h1>LinkDrop</h1>
      <p>Tempel link, unduh kapan saja.</p>
    </div>
  </header>

  <div class="install-banner" id="installBanner">
    <span>Pasang LinkDrop sebagai aplikasi di HP kamu.</span>
    <button id="installBtn">Pasang</button>
  </div>

  <form id="addForm">
    <div class="field">
      <label for="urlInput">Link</label>
      <input id="urlInput" type="url" inputmode="url" placeholder="https://…" required>
    </div>
    <div class="field name">
      <label for="nameInput">Nama (opsional)</label>
      <input id="nameInput" type="text" placeholder="Contoh: Materi Kuliah.pdf">
    </div>
    <button type="submit">Tambah ke Antrian</button>
  </form>

  <div class="summary">
    <span><b id="pendingCount">0</b> menunggu · <b id="doneCount">0</b> sudah diunduh</span>
    <div class="actions-row">
      <button class="ghost-btn primary" id="downloadAllBtn">Unduh Semua</button>
      <button class="ghost-btn" id="clearDoneBtn">Bersihkan</button>
    </div>
  </div>

  <div class="queue" id="queue"></div>

  <div class="empty" id="emptyState" style="display:none">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v11m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="#8B8DA8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <p>Antrian masih kosong.<br>Tempel link pertamamu di atas untuk mulai.</p>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = "linkdrop.items";
  const $ = (id) => document.getElementById(id);
  const queueEl = $("queue"), emptyEl = $("emptyState");
  const pendingCountEl = $("pendingCount"), doneCountEl = $("doneCount");

  function load(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }
  function save(items){ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }

  let items = load();

  function guessName(url){
    try{
      const u = new URL(url);
      const last = u.pathname.split("/").filter(Boolean).pop();
      return last ? decodeURIComponent(last) : u.hostname;
    }catch{ return url; }
  }
  function hostOf(url){
    try{ return new URL(url).hostname.replace(/^www\./,""); }catch{ return url; }
  }

  function render(){
    queueEl.innerHTML = "";
    if(items.length === 0){
      emptyEl.style.display = "block";
    } else {
      emptyEl.style.display = "none";
      items.slice().reverse().forEach((item) => {
        const card = document.createElement("div");
        card.className = "card " + (item.done ? "done" : "pending");
        card.innerHTML = `
          <span class="status-dot"></span>
          <div class="card-body">
            <p class="card-name">${escapeHtml(item.name)}</p>
            <span class="card-url">${escapeHtml(hostOf(item.url))}</span>
          </div>
          <div class="card-actions">
            <button class="icon-btn download" title="Unduh" data-id="${item.id}" data-action="download">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 18h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="icon-btn delete" title="Hapus" data-id="${item.id}" data-action="delete">
              <svg viewBox="0 0 24 24" fill="none"><path d="M5 6h14M9 6V4h6v2m-8 0l1 14h8l1-14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>`;
        queueEl.appendChild(card);
      });
    }
    const pending = items.filter(i => !i.done).length;
    const done = items.length - pending;
    pendingCountEl.textContent = pending;
    doneCountEl.textContent = done;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function showToast(msg){
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.remove("show"), 1800);
  }

  function triggerDownload(item){
    const a = document.createElement("a");
    a.href = item.url;
    a.download = item.name || "";
    a.rel = "noopener";
    a.target = "_blank";
    document.body.appendChild(a);
    a.click();
    a.remove();
    item.done = true;
    save(items);
    render();
  }

  $("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const urlInput = $("urlInput"), nameInput = $("nameInput");
    let url = urlInput.value.trim();
    if(!url) return;
    if(!/^https?:\/\//i.test(url)) url = "https://" + url;
    const name = nameInput.value.trim() || guessName(url);
    items.push({ id: Date.now() + "-" + Math.random().toString(36).slice(2,7), url, name, done:false });
    save(items);
    urlInput.value = ""; nameInput.value = "";
    render();
    showToast("Ditambahkan ke antrian");
  });

  queueEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if(!btn) return;
    const id = btn.dataset.id;
    const item = items.find(i => i.id === id);
    if(!item) return;
    if(btn.dataset.action === "download"){
      triggerDownload(item);
    } else if(btn.dataset.action === "delete"){
      items = items.filter(i => i.id !== id);
      save(items);
      render();
    }
  });

  $("downloadAllBtn").addEventListener("click", () => {
    const pending = items.filter(i => !i.done);
    if(pending.length === 0){ showToast("Tidak ada yang menunggu"); return; }
    pending.forEach((item, idx) => {
      setTimeout(() => triggerDownload(item), idx * 700);
    });
  });

  $("clearDoneBtn").addEventListener("click", () => {
    const before = items.length;
    items = items.filter(i => !i.done);
    if(items.length === before){ showToast("Tidak ada yang perlu dibersihkan"); return; }
    save(items);
    render();
    showToast("Riwayat unduhan dibersihkan");
  });

  // Install prompt handling
  let deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    $("installBanner").classList.add("show");
  });
  $("installBtn").addEventListener("click", async () => {
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    $("installBanner").classList.remove("show");
  });
  window.addEventListener("appinstalled", () => {
    $("installBanner").classList.remove("show");
  });

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  render();
</script>
</body>
</html>
