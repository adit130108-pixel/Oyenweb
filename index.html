<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16110B">
<title>OYEN Link</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --oyen:#FF7A33;
    --oyen-dark:#C85A1E;
    --bg:#16110B;
    --surface:rgba(32,24,16,0.62);
    --line:rgba(255,255,255,0.14);
    --text:#FFF6EC;
    --text-dim:rgba(255,246,236,0.68);
    --radius:20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; min-height:100%;}
  body{
    background-color:var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    min-height:100vh;
    padding-bottom:calc(env(safe-area-inset-bottom) + 20px);
    position:relative;
  }

  .bg-video{
    position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover; z-index:-2;
  }
  .bg-overlay{
    position:fixed; inset:0; z-index:-1;
    background:linear-gradient(180deg, rgba(16,11,7,.60), rgba(16,11,7,.82));
  }
  .sound-btn{
    position:fixed; top:calc(env(safe-area-inset-top) + 14px); right:14px; z-index:60;
    display:flex; align-items:center; gap:6px;
    background:rgba(20,14,8,0.72); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid var(--line); color:var(--text);
    border-radius:999px; padding:9px 14px; font-size:12.5px; font-weight:600;
    font-family:'Inter', sans-serif; cursor:pointer;
  }
  .sound-btn svg{width:15px; height:15px;}

  .wrap{max-width:520px; margin:0 auto; padding:30px 18px 40px;}

  header{text-align:center; padding:6px 0 20px;}
  .mark{
    width:64px; height:64px; border-radius:18px; margin:0 auto 12px;
    background:linear-gradient(160deg, var(--oyen), var(--oyen-dark));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(255,122,51,0.35);
  }
  .mark svg{width:32px; height:32px;}
  header h1{
    font-family:'Baloo 2', sans-serif; font-size:28px; font-weight:800; margin:0;
    letter-spacing:-0.01em;
  }
  header p{margin:4px 0 0; font-size:13.5px; color:var(--text-dim);}

  .tiktok-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--surface); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:14px; padding:13px;
    text-decoration:none; color:var(--text); font-weight:600; font-size:14.5px;
    margin:18px 0 24px; transition:transform .1s;
  }
  .tiktok-btn:active{transform:scale(0.98);}
  .tiktok-btn svg{width:19px; height:19px; flex:none;}
  .tiktok-btn b{color:var(--oyen);}

  .list{display:flex; flex-direction:column; gap:10px;}
  .card{
    background:var(--surface); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:16px; padding:14px;
    display:flex; align-items:center; gap:12px;
  }
  .card.placeholder{opacity:.55;}
  .card-num{
    width:30px; height:30px; border-radius:9px; flex:none;
    background:rgba(255,122,51,0.16); color:var(--oyen);
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:13px;
  }
  .card-body{flex:1; min-width:0;}
  .card-name{font-family:'Baloo 2', sans-serif; font-size:15.5px; font-weight:700; margin:0 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card-sub{font-size:11.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;}
  .icon-btn{
    width:38px; height:38px; border-radius:11px; border:1px solid var(--line);
    background:rgba(0,0,0,0.25); display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text); text-decoration:none; flex:none;
  }
  .icon-btn svg{width:17px; height:17px;}
  .icon-btn.download{border-color:var(--oyen); color:var(--oyen);}

  footer{text-align:center; margin-top:26px; font-size:11.5px; color:var(--text-dim); opacity:.6;}
</style>
</head>
<body>
<video class="bg-video" id="bgVideo" autoplay muted loop playsinline preload="auto">
  <source src="background.mp4" type="video/mp4">
</video>
<div class="bg-overlay"></div>
<button class="sound-btn" id="soundBtn">
  <svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 5V4L8 9H4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M18 8a6 6 0 010 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  <span id="soundLabel">Aktifkan Suara</span>
</button>

<div class="wrap">

  <header>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none">
        <ellipse cx="12" cy="14.5" rx="5.2" ry="4" fill="#1a0d02"/>
        <circle cx="6.3" cy="8.5" r="2.1" fill="#1a0d02"/>
        <circle cx="10.3" cy="6.3" r="2.1" fill="#1a0d02"/>
        <circle cx="13.7" cy="6.3" r="2.1" fill="#1a0d02"/>
        <circle cx="17.7" cy="8.5" r="2.1" fill="#1a0d02"/>
      </svg>
    </div>
    <h1>OYEN Link</h1>
    <p>Kumpulan link download dari OYEN.</p>
  </header>

  <a class="tiktok-btn" href="https://www.tiktok.com/@meong_13d" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.82a4.28 4.28 0 01-2.05-3.5h-3.1v13.4a2.6 2.6 0 11-2.6-2.6c.26 0 .5.03.74.1V9.9a5.7 5.7 0 00-.74-.05A5.72 5.72 0 108.5 21.4a5.72 5.72 0 005.71-5.72V9.1a7.4 7.4 0 004.39 1.42V7.4a4.27 4.27 0 01-2-1.58z"/></svg>
    Dukung OYEN, <b>Follow TikTok @meong_13d</b>
  </a>

  <div class="list" id="list"></div>

  <footer>OYEN Link</footer>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function hostOf(url){
    try{ return new URL(url).hostname.replace(/^www\./,""); }catch{ return url; }
  }

  async function loadLinks(){
    let items = [];
    try{
      const res = await fetch("./links.json?_=" + Date.now(), { cache: "no-store" });
      items = await res.json();
    }catch{
      items = [];
    }
    const listEl = $("list");
    listEl.innerHTML = "";
    items.forEach((item, idx) => {
      const hasLink = item.url && item.url.trim().length > 0;
      const name = item.name && item.name.trim() ? item.name.trim() : "Segera hadir";
      const card = document.createElement("div");
      card.className = "card" + (hasLink ? "" : " placeholder");
      card.innerHTML = `
        <div class="card-num">${idx + 1}</div>
        <div class="card-body">
          <p class="card-name">${escapeHtml(name)}</p>
          <span class="card-sub">${hasLink ? escapeHtml(hostOf(item.url)) : "Belum tersedia"}</span>
        </div>
        ${hasLink ? `<a class="icon-btn download" href="${escapeHtml(item.url)}" target="_blank" rel="noopener" title="Unduh">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 18h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>` : ""}
      `;
      listEl.appendChild(card);
    });
  }

  // background video sound toggle
  const bgVideo = $("bgVideo");
  const soundBtn = $("soundBtn");
  const soundLabel = $("soundLabel");
  bgVideo.addEventListener("error", () => { bgVideo.style.display = "none"; }, true);
  soundBtn.addEventListener("click", () => {
    if(bgVideo.muted){
      bgVideo.muted = false;
      bgVideo.play().catch(() => {});
      soundLabel.textContent = "Matikan Suara";
    } else {
      bgVideo.muted = true;
      soundLabel.textContent = "Aktifkan Suara";
    }
  });

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  loadLinks();
</script>
</body>
</html>
